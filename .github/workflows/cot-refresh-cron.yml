# CFTC COT weekly refresh: pulls the latest week from TFF/Disaggregated/Legacy and
# upserts into `cot_weekly`. Deploy the app with /api/cron/cot-refresh before enabling.
#
# Setup (repository Settings -> Secrets and variables -> Actions):
#   APP_BASE_URL — public origin only, e.g. https://your-service.onrender.com (no trailing slash)
#   CRON_SECRET  — must match the production env CRON_SECRET on your host
#
# CFTC publishes Friday ~3:30pm ET (positions as of the prior Tuesday). Saturday morning is safe.
#
# Schedule (UTC):
#   Saturday 14:00 — ~9-10am ET, comfortably after the Friday release.
#
# workflow_dispatch runs the same refresh on demand (bootstrap or catch-up).

name: COT Refresh Cron

on:
  schedule:
    - cron: "0 14 * * 6"
  workflow_dispatch:

concurrency:
  group: cot-refresh-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: POST /api/cron/cot-refresh
        uses: ./.github/actions/post-cron-endpoint
        with:
          base_url: ${{ secrets.APP_BASE_URL }}
          cron_secret: ${{ secrets.CRON_SECRET }}
          path: /api/cron/cot-refresh
          max_time_seconds: "120"
