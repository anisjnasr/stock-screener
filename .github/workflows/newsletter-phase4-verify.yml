# One-click verify Phase 4 (ingest → macro) against production.
# Use after setting repository secrets APP_BASE_URL and CRON_SECRET.
#
# GitHub: Actions → "Phase 4 newsletter verify" → Run workflow

name: Phase 4 newsletter verify

on:
  workflow_dispatch:

concurrency:
  group: newsletter-phase4-verify
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: POST newsletter-ingest then macro-writeup
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "::error::Set repository secrets APP_BASE_URL and CRON_SECRET (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          BASE_TRIMMED="${BASE%/}"

          echo "=== 1/2 POST newsletter-ingest ==="
          URL="${BASE_TRIMMED}/api/cron/newsletter-ingest"
          code=$(curl -sS -o resp-ingest.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Accept: application/json")
          echo "HTTP $code"
          cat resp-ingest.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Ingest expected HTTP 200, got $code"
            python3 -c "import json; d=json.load(open('resp-ingest.json')); print('error:', d.get('error', d))" || true
            exit 1
          fi
          python3 -c "import json; j=json.load(open('resp-ingest.json')); assert j.get('ok') is True, j"

          echo "=== 2/2 POST macro-writeup ==="
          URL2="${BASE_TRIMMED}/api/cron/macro-writeup"
          code2=$(curl -sS -o resp-macro.json -w "%{http_code}" -X POST "$URL2" \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Accept: application/json")
          echo "HTTP $code2"
          cat resp-macro.json
          echo
          if [ "$code2" != "200" ]; then
            echo "::error::Macro expected HTTP 200, got $code2"
            python3 -c "import json; d=json.load(open('resp-macro.json')); print('error:', d.get('error', d))" || true
            exit 1
          fi
          python3 -c "import json; j=json.load(open('resp-macro.json')); assert j.get('ok') is True, j"

          echo "::notice::Phase 4 verify OK (ingest + macro)."
