# Daily data refresh: fetch latest market data, recompute indicators.
# Runs at 2am UAE time (22:00 UTC previous day), Tue-Sat.
# Uses GitHub Actions cache to persist the SQLite DB between runs.
#
# FIRST-TIME SETUP:
#   1. Add MASSIVE_API_KEY in Settings → Secrets → Actions (done).
#   2. Add a self-hosted runner (Settings → Actions → Runners → New self-hosted).
#   3. Manually run this workflow with "Seed DB path" set to your local screener.db path.
#   4. After that run, cache is populated; scheduled runs use ubuntu-latest and the cache.

name: Stocks Data Refresh

on:
  schedule:
    # 22:00 UTC (previous day) = 2:00 AM UAE — runs Tue-Sat UAE (covers Mon-Fri market closes)
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      seed_db_path:
        description: "Path to screener.db on runner (first-time seed only; use with self-hosted runner)"
        required: false
        type: string
      run_financials:
        description: "Also refresh financials (quarterly)"
        type: boolean
        default: false
      skip_daily:
        description: "Skip daily bars refresh"
        type: boolean
        default: false
      full_mm_recompute:
        description: "Full Market Monitor rebuild (--all, last ~2y of dates). Use after MM logic changes or stale rows; normal runs stay incremental."
        type: boolean
        default: false

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"
  DB_CACHE_PREFIX: screener-db-v1

jobs:
  seed_db:
    # First-time seed only: copy local DB from Windows self-hosted runner.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.seed_db_path != '' }}
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Validate seed runner context
        run: |
          node -e "
          const os = process.platform;
          if (os !== 'win32') {
            console.error('::error::Seed DB path was provided, but this job is not running on a Windows self-hosted runner.');
            console.error('::error::Open Run workflow, set Seed DB path, and ensure a Windows self-hosted runner is Online.');
            process.exit(1);
          }
          "

      - name: Copy seed DB
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const src = process.env.SEED_DB_PATH;
          const dest = path.join('data', 'screener.db');
          fs.mkdirSync('data', { recursive: true });
          if (!src || !fs.existsSync(src)) {
            console.error('::error::Seed DB path does not exist on this runner: ' + (src || '<empty>'));
            process.exit(1);
          }
          fs.copyFileSync(src, dest);
          const mb = Math.round(fs.statSync(dest).size / 1024 / 1024);
          console.log('Copied seed DB to', dest, '| Size', mb, 'MB');
          "
        env:
          SEED_DB_PATH: ${{ github.event.inputs.seed_db_path }}

      - name: Verify seeded DB exists
        run: |
          node -e "
          const fs = require('fs');
          const p = 'data/screener.db';
          if (!fs.existsSync(p)) {
            console.error('::error::No cached screener.db found. First-time: run workflow manually with Seed DB path set and use a self-hosted runner.');
            process.exit(1);
          }
          console.log('DB size', Math.round(fs.statSync(p).size/1024/1024), 'MB');
          "

      - name: Upload seeded DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: seeded-db-${{ github.run_id }}
          path: data/screener.db
          retention-days: 1
          compression-level: 1

  refresh:
    needs: [seed_db]
    if: ${{ always() && (needs.seed_db.result == 'success' || needs.seed_db.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Incremental MM is fast; full --all + upload/sync may still need headroom.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Restore DB from cache (most recent available)
      - name: Restore DB from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data/screener.db
          key: ${{ env.DB_CACHE_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.DB_CACHE_PREFIX }}-
          enableCrossOsArchive: true

      # If this is a seed run, use seeded DB artifact (overrides cache restore)
      - name: Download seeded DB artifact
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.seed_db_path != '' }}
        uses: actions/download-artifact@v4
        with:
          name: seeded-db-${{ github.run_id }}
          path: data

      - name: Verify DB exists
        run: |
          node -e "
          const fs = require('fs');
          const p = 'data/screener.db';
          if (!fs.existsSync(p)) {
            console.error('::error::No screener.db found from cache or seed artifact.');
            process.exit(1);
          }
          console.log('DB size', Math.round(fs.statSync(p).size/1024/1024), 'MB');
          "

      # Ensure companies table reflects the full all-stocks.json universe
      - name: Refresh companies table
        run: node scripts/seed-companies.mjs

      # Daily bars + indicators refresh
      - name: Refresh daily bars & indicators
        if: ${{ github.event.inputs.skip_daily != 'true' }}
        run: node scripts/refresh-daily.mjs
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        timeout-minutes: 90

      # Financials refresh (optional, for quarterly runs)
      - name: Refresh financials
        if: ${{ github.event.inputs.run_financials == 'true' }}
        run: node scripts/refresh-financials.mjs
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        timeout-minutes: 60

      # Optimize after refresh
      - name: Optimize database
        run: node scripts/optimize-db.mjs

      # Fill missing quote_daily.market_cap (and related fields) from bars + shares so MM cap
      # filter sees market_cap on fresh quote rows before precompute runs.
      - name: Backfill quote-derived fields from bars
        run: node scripts/backfill-quote-derived-from-bars.mjs
        timeout-minutes: 30

      # Full MM rebuild needs indicator history refreshed too (7x ATR / EP live in indicators_daily).
      - name: Recompute indicators history for full MM rebuild
        if: ${{ github.event.inputs.full_mm_recompute == 'true' }}
        run: |
          echo "full_mm_recompute=true: rebuilding indicators for last ~2y"
          node scripts/compute-indicators-from-bars.mjs --years 2
        timeout-minutes: 240

      # Precompute market_monitor_daily and breadth_daily (SQLite only; no Massive).
      # Default: incremental (--days 1) when MM table is warm; cold DB uses --days 504.
      # Optional workflow input full_mm_recompute runs bounded --all (~2y of dates in script).
      - name: Precompute market aggregates
        run: |
          set -e
          FULL_MM="${{ github.event.inputs.full_mm_recompute }}"
          ROWS=$(node -e "
          const Database = require('better-sqlite3');
          const db = new Database('data/screener.db', { readonly: true });
          let c = 0;
          try {
            c = Number(db.prepare('SELECT COUNT(*) AS c FROM market_monitor_daily').get().c) || 0;
          } catch (_) { /* missing table */ }
          db.close();
          process.stdout.write(String(c));
          ")
          echo "market_monitor_daily rows: $ROWS"
          if [ "$FULL_MM" = "true" ]; then
            echo "Full MM recompute (--all)"
            node scripts/compute-market-aggregates.mjs --all
          elif [ "$ROWS" -lt 50 ]; then
            echo "Cold bootstrap: --days 504"
            node scripts/compute-market-aggregates.mjs --days 504
          else
            echo "Incremental: --days 1"
            node scripts/compute-market-aggregates.mjs --days 1
          fi
        timeout-minutes: 180

      - name: Full MM signal sanity (7x ATR / EP)
        if: ${{ github.event.inputs.full_mm_recompute == 'true' }}
        run: |
          node -e "
          const Database = require('better-sqlite3');
          const db = new Database('data/screener.db', { readonly: true });
          try {
            const row = db.prepare(
              \`SELECT
                 COALESCE(SUM(COALESCE(count_7x_atr_50d, 0)), 0) AS s7,
                 COALESCE(SUM(COALESCE(count_episodic_pivot, 0)), 0) AS sep,
                 COUNT(*) AS n
               FROM (
                 SELECT count_7x_atr_50d, count_episodic_pivot
                 FROM market_monitor_daily
                 ORDER BY date DESC
                 LIMIT 60
               )\`
            ).get();
            console.log('Full MM signal sanity (last 60 rows):', row);
            const sum7 = Number(row?.s7 ?? 0);
            const sumEp = Number(row?.sep ?? 0);
            const n = Number(row?.n ?? 0);
            if (n > 0 && sum7 === 0 && sumEp === 0) {
              console.error('::error::full_mm_recompute produced all-zero 7x ATR and EP counts in recent rows. Indicators backfill likely failed or stale.');
              process.exit(1);
            }
          } finally {
            db.close();
          }
          "

      - name: MM NNH sanity (latest row in DB)
        run: |
          node -e "
          const Database = require('better-sqlite3');
          const db = new Database('data/screener.db', { readonly: true });
          try {
            const latest = db.prepare(
              'SELECT date, nnh_52w_highs, nnh_52w_lows, nnh_1m_highs, nnh_1m_lows FROM market_monitor_daily ORDER BY date DESC LIMIT 1'
            ).get();
            const maxH = db.prepare('SELECT COALESCE(MAX(nnh_52w_highs), -1) AS m FROM market_monitor_daily').get();
            console.log('MM NNH latest row:', JSON.stringify(latest));
            console.log('MAX(nnh_52w_highs) in market_monitor_daily:', maxH?.m);
          } catch (e) {
            console.error('MM NNH sanity check failed:', e && e.message);
            process.exit(1);
          } finally {
            db.close();
          }
          "

      # Warm secondary-page disk caches (best-effort; failures here don't block the pipeline).
      - name: Warm secondary page caches
        continue-on-error: true
        env:
          HEALTH_REQUIRE_OWNERSHIP: "0"
          HEALTH_REQUIRE_FINANCIALS: "0"
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/next-dev.log 2>&1 &
          echo $! > /tmp/next-dev.pid

          # Wait for the dev server to accept connections (any HTTP response = server is up)
          echo "Waiting for dev server..."
          for i in $(seq 1 120); do
            if curl -sS -o /dev/null -w '' http://127.0.0.1:3000/api/health 2>/dev/null; then
              echo "Dev server ready (attempt $i)"
              break
            fi
            sleep 1
          done

          curl -sS --max-time 120 "http://127.0.0.1:3000/api/market-monitor" >/tmp/mm.json || echo "market-monitor cache warm failed (non-fatal)"
          curl -sS --max-time 60  "http://127.0.0.1:3000/api/sectors-industries" >/tmp/si.json || echo "sectors-industries cache warm failed (non-fatal)"
          curl -sS --max-time 120 "http://127.0.0.1:3000/api/breadth?index=sp500" >/tmp/breadth-sp500.json || echo "breadth sp500 cache warm failed (non-fatal)"
          curl -sS --max-time 120 "http://127.0.0.1:3000/api/breadth?index=nasdaq" >/tmp/breadth-nasdaq.json || echo "breadth nasdaq cache warm failed (non-fatal)"

      - name: Stop cache warmup app
        if: ${{ always() }}
        run: |
          if [ -f /tmp/next-dev.pid ]; then
            kill "$(cat /tmp/next-dev.pid)" || true
          fi
          pkill -f "next dev" || true

      # Create a clean, self-contained copy for upload.  VACUUM INTO rebuilds
      # the entire DB from scratch (no WAL dependency, no free-list pages,
      # fully defragmented B-trees). This guarantees the uploaded file is a
      # valid standalone SQLite database regardless of journal mode or WAL state.
      - name: Prepare DB for upload
        run: |
          node -e "
          const Database = require('better-sqlite3');
          const fs = require('fs');

          console.log('Opening DB...');
          const db = new Database('data/screener.db');
          db.pragma('wal_checkpoint(TRUNCATE)');

          // Integrity check on source DB
          const ic = db.pragma('integrity_check');
          console.log('Source DB integrity:', ic[0].integrity_check);
          if (ic[0].integrity_check !== 'ok') {
            console.error('WARNING: Source DB has integrity issues!');
            ic.slice(0, 5).forEach(r => console.error(' ', r.integrity_check));
          }

          const latest = db.prepare('SELECT MAX(date) AS d FROM daily_bars').get();
          const companies = db.prepare('SELECT COUNT(*) AS c FROM companies').get();
          console.log('Latest daily_bars:', latest.d, '| Companies:', companies.c);

          // VACUUM INTO creates a fresh, standalone copy
          console.log('Creating clean copy via VACUUM INTO...');
          if (fs.existsSync('data/screener-upload.db')) fs.unlinkSync('data/screener-upload.db');
          db.exec(\"VACUUM INTO 'data/screener-upload.db'\");
          db.close();

          // Verify the clean copy
          const clean = new Database('data/screener-upload.db', { readonly: true });
          const ic2 = clean.pragma('integrity_check');
          console.log('Clean copy integrity:', ic2[0].integrity_check);
          const latest2 = clean.prepare('SELECT MAX(date) AS d FROM daily_bars').get();
          const companies2 = clean.prepare('SELECT COUNT(*) AS c FROM companies').get();
          console.log('Clean copy: latest daily_bars:', latest2.d, '| Companies:', companies2.c);
          clean.close();

          // Replace original with clean copy
          fs.renameSync('data/screener-upload.db', 'data/screener.db');
          // Remove any leftover WAL/SHM files
          try { fs.unlinkSync('data/screener.db-wal'); } catch {}
          try { fs.unlinkSync('data/screener.db-shm'); } catch {}

          const sizeMB = Math.round(fs.statSync('data/screener.db').size / 1024 / 1024);
          console.log('Upload-ready DB:', sizeMB, 'MB | journal_mode: delete (standalone)');
          "

      - name: Generate DB manifest
        run: |
          export DB_SHA256=$(sha256sum data/screener.db | awk '{print $1}')
          export DB_BYTES=$(stat -c%s data/screener.db)
          node -e "
          const fs = require('fs');
          const bytes = Number(process.env.DB_BYTES);
          const out = {
            runId: process.env.GITHUB_RUN_ID,
            mode: 'daily',
            dbBytes: bytes,
            dbSizeMb: Math.ceil(bytes / 1024 / 1024),
            sha256: process.env.DB_SHA256,
            generatedAt: new Date().toISOString()
          };
          fs.writeFileSync('data/screener-db-manifest.json', JSON.stringify(out, null, 2));
          console.log('Manifest generated:', out);
          "

      # Save updated DB to cache
      - name: Save DB to cache
        uses: actions/cache/save@v4
        with:
          path: data/screener.db
          key: ${{ env.DB_CACHE_PREFIX }}-${{ github.run_id }}
          enableCrossOsArchive: true

      # Upload as artifact for deployment pipeline to pick up
      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: screener-db-${{ github.run_id }}
          path: |
            data/screener.db
            data/screener-db-manifest.json
          retention-days: 3
          compression-level: 1

      - name: Upload DB manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: screener-db-manifest-${{ github.run_id }}
          path: data/screener-db-manifest.json
          retention-days: 3
          compression-level: 1

      # Trigger DB sync on Render. The sync-db endpoint looks up the latest
      # artifact from the GitHub API and downloads it directly on the server
      # via curl+funzip (background process). No large upload needed.
      # Requires GITHUB_TOKEN to be set on Render's environment.
      - name: Sync DB to Render
        uses: ./.github/actions/render-db-sync
        with:
          render_app_url: ${{ secrets.RENDER_APP_URL }}
          admin_secret: ${{ secrets.ADMIN_SECRET }}
          artifact: daily
          existing_max_polls: "320"
          new_max_polls: "320"
          poll_interval_seconds: "30"
          stale_threshold_polls: "60"

      - name: Verify live MM signals after sync
        if: ${{ github.event.inputs.full_mm_recompute == 'true' }}
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          if [ -z "$RENDER_APP_URL" ]; then
            echo "Skipping live MM signal verification: RENDER_APP_URL not configured"
            exit 0
          fi
          URL="${RENDER_APP_URL}/api/market-monitor"
          echo "Checking live market monitor at $URL"
          HTTP_CODE=$(curl -sS -o /tmp/live-mm.json -w "%{http_code}" --max-time 180 "$URL")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Live market monitor check failed with HTTP $HTTP_CODE"
            cat /tmp/live-mm.json || true
            exit 1
          fi
          node -e "
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/live-mm.json', 'utf8'));
          const rows = Array.isArray(payload?.rows) ? payload.rows.slice(0, 60) : [];
          if (!rows.length) {
            console.error('::error::Live market monitor returned no rows.');
            process.exit(1);
          }
          const sum7 = rows.reduce((a, r) => a + Number(r?.count7xAtr50d ?? 0), 0);
          const sumEp = rows.reduce((a, r) => a + Number(r?.countEpisodicPivot ?? 0), 0);
          console.log('Live MM signal sanity (last', rows.length, 'rows):', { sum7, sumEp });
          if (sum7 === 0 && sumEp === 0) {
            console.error('::error::Live /api/market-monitor still shows all-zero 7x ATR and EP after sync.');
            process.exit(1);
          }
          "

      - name: Send completion email via Formspree
        if: ${{ always() }}
        env:
          FORMSPREE_ENDPOINT: ${{ secrets.FORMSPREE_ENDPOINT }}
        run: |
          if [ -z "$FORMSPREE_ENDPOINT" ]; then
            echo "Skipping notification: FORMSPREE_ENDPOINT not configured"
            exit 0
          fi
          STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          curl -s -X POST "$FORMSPREE_ENDPOINT" \
            -H "Content-Type: application/json" \
            -d "{
              \"_subject\": \"[StockStalker] Daily Refresh — ${STATUS}\",
              \"workflow\": \"Stocks Data Refresh\",
              \"status\": \"${STATUS}\",
              \"completed\": \"${DATE}\",
              \"run_url\": \"${RUN_URL}\"
            }" || echo "Formspree notification failed (non-fatal)"
