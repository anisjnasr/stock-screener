# POST /api/cron/newsletter-ingest (Gmail → Supabase newsletter_archive)
#
# Secrets: APP_BASE_URL, CRON_SECRET (see workflow header in economic-calendar-cron.yml)
#
# 11:00 UTC ≈ 7:00 AM US Eastern during EDT. Run before `premarket-brief-pipeline.yml` (11:12 UTC).

name: Newsletter ingest

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

concurrency:
  group: newsletter-ingest-cron
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: POST /api/cron/newsletter-ingest
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "::notice::Skipping: APP_BASE_URL or CRON_SECRET is not set."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Add repository Actions secrets APP_BASE_URL and CRON_SECRET."
              exit 1
            fi
            exit 0
          fi
          BASE_TRIMMED="${BASE%/}"
          URL="${BASE_TRIMMED}/api/cron/newsletter-ingest"
          echo "POST $URL"
          code=$(curl -sS -o resp.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Accept: application/json")
          echo "HTTP $code"
          cat resp.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Expected HTTP 200, got $code"
            exit 1
          fi
          python3 -c "import json,sys; j=json.load(open('resp.json')); assert j.get('ok') is True, j"
