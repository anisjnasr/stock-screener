# POST /api/cron/newsletter-ingest (Gmail → Supabase newsletter_archive)
#
# Secrets: APP_BASE_URL, CRON_SECRET (see workflow header in economic-calendar-cron.yml)
#
# Runs at 06:00, 13:30, 14:00, 14:30, and 16:00 UAE time on weekdays.
# Successful completion triggers `premarket-brief-pipeline.yml`.

name: Newsletter ingest

on:
  schedule:
    # 06:00, 13:30, 14:00, 14:30, 16:00 UAE time (UTC+4).
    - cron: "0 2,10,12 * * 1-5"
    - cron: "30 9,10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: newsletter-ingest-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: POST /api/cron/newsletter-ingest
        uses: ./.github/actions/post-cron-endpoint
        with:
          base_url: ${{ secrets.APP_BASE_URL }}
          cron_secret: ${{ secrets.CRON_SECRET }}
          path: /api/cron/newsletter-ingest
