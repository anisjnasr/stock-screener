# Triggers production POST /api/cron/market-events/* (Fed, Treasury, White House, USTR → Supabase).
# Uses the same secrets as Economic Calendar Injest:
#   APP_BASE_URL — public origin only, e.g. https://your-service.onrender.com (no trailing slash)
#   CRON_SECRET  — must match production CRON_SECRET on your host
#
# Supabase: run data/supabase-market-events.sql once (SQL Editor) before first run.

name: Market Events Ingest

on:
  schedule:
    # Daily 07:00 UTC (adjust as needed; idempotent upserts)
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: market-events-cron
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: POST market-events crons
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "::notice::Skipping ingest: APP_BASE_URL or CRON_SECRET is not set."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Add repository Actions secrets APP_BASE_URL and CRON_SECRET."
              exit 1
            fi
            exit 0
          fi
          BASE_TRIMMED="${BASE%/}"
          post() {
            local path="$1"
            local url="${BASE_TRIMMED}${path}"
            echo "POST $url"
            code=$(curl -sS -o "resp-${path//\//_}.json" -w "%{http_code}" -X POST "$url" \
              -H "Authorization: Bearer ${SECRET}" \
              -H "Accept: application/json")
            echo "HTTP $code"
            cat "resp-${path//\//_}.json"
            echo
            if [ "$code" != "200" ]; then
              echo "::error::Expected HTTP 200 for $path, got $code"
              exit 1
            fi
            python3 -c "import json; j=json.load(open('resp-${path//\//_}.json')); assert j.get('ok') is True, j"
          }
          post "/api/cron/market-events/fed"
          post "/api/cron/market-events/treasury"
          post "/api/cron/market-events/white-house"
          post "/api/cron/market-events/ustr"
