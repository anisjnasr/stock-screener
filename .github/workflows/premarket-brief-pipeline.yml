# Sequential morning pipeline: themes.
# Runs after Newsletter ingest completes so `newsletter_archive` has the latest allowlisted messages.
#
# Newsletter ingest is scheduled at 06:00, 13:00, 14:00, and 16:00 UAE time.
#
# Secrets: APP_BASE_URL, CRON_SECRET
#
# Individual POST routes remain available via workflow_dispatch on each cron workflow.

name: Premarket brief pipeline

on:
  workflow_run:
    workflows: ["Newsletter ingest"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: premarket-brief-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  brief:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: POST /api/cron/theme-extraction
        uses: ./.github/actions/post-cron-endpoint
        with:
          base_url: ${{ secrets.APP_BASE_URL }}
          cron_secret: ${{ secrets.CRON_SECRET }}
          path: /api/cron/theme-extraction

