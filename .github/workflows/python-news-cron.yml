# Calls production POST /api/cron/python-news (Next.js → Python POST /news).
# Keeps headline path warm and supports batch-style pulls without opening the app.
#
# Repository Settings → Secrets and variables → Actions:
#   APP_BASE_URL   — origin only, e.g. https://your-service.onrender.com (no trailing slash)
#   CRON_SECRET    — must match production CRON_SECRET on the host
#
# Production host must also set PYTHON_SERVICE_URL and PYTHON_SERVICE_KEY (same as Python INTERNAL_API_KEY).

name: Python ticker news cron

on:
  schedule:
    # Weekdays 11:15, 13:15, 15:15, 17:15, 19:15, 21:15 UTC (covers US premarket and session)
    - cron: "15 11,13,15,17,19,21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: python-news-cron
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/python-news
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "::notice::Skipping: APP_BASE_URL or CRON_SECRET is not set."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Add repository Actions secrets APP_BASE_URL and CRON_SECRET (see workflow header comment)."
              exit 1
            fi
            exit 0
          fi
          BASE_TRIMMED="${BASE%/}"
          URL="${BASE_TRIMMED}/api/cron/python-news"
          BODY='{"tickers":["SPY","QQQ","IWM","NVDA","MSFT","AAPL","META","GOOGL","AMZN","AVGO","AMD","JPM","XOM","UNH"],"hours_back":24}'
          echo "POST $URL"
          code=$(curl -sS -o resp.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$BODY")
          echo "HTTP $code"
          cat resp.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Expected HTTP 200, got $code"
            exit 1
          fi
          python3 -c "import json,sys; j=json.load(open('resp.json')); assert j.get('ok') is True, j"
