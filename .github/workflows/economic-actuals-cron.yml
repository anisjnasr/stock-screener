# POST /api/cron/economic-actuals — web-search economic_events.actual after scheduled releases.
#
# GitHub Actions cannot dynamically schedule from Supabase event rows, so this runs hourly
# during the weekday US data-release window. The API only processes missing actuals when
# the event is at least 1 minute past its scheduled ET release time.
#
# Setup (repository Settings → Secrets and variables → Actions):
#   APP_BASE_URL   — public origin only (no trailing slash)
#   CRON_SECRET    — must match production CRON_SECRET
#
# Host env: ANTHROPIC_API_KEY, SUPABASE_SERVICE_ROLE_KEY.

name: Economic Actuals Web Search

on:
  schedule:
    # Weekdays hourly at :01 UTC; covers common US release windows across EST/EDT.
    - cron: "1 12-22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: economic-actuals-cron
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: POST /api/cron/economic-actuals
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "::notice::Skipping: APP_BASE_URL or CRON_SECRET is not set."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Add repository Actions secrets APP_BASE_URL and CRON_SECRET."
              exit 1
            fi
            exit 0
          fi
          BASE_TRIMMED="${BASE%/}"
          URL="${BASE_TRIMMED}/api/cron/economic-actuals"
          echo "POST $URL"
          code=$(curl -sS -o resp.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Accept: application/json")
          echo "HTTP $code"
          cat resp.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Expected HTTP 200, got $code"
            exit 1
          fi
          python3 -c "import json; j=json.load(open('resp.json')); assert j.get('ok') is True, j"
