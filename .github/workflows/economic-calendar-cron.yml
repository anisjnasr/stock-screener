# Triggers production calendar ingests:
#   - /api/cron/economic-calendar (Forex Factory → Supabase)
#   - /api/cron/market-events/* (Fed, Treasury, White House, USTR → Supabase)
# Operator guide: docs/ECONOMIC-CALENDAR-PRODUCTION.md
#
# Setup (repository Settings → Secrets and variables → Actions):
#   APP_BASE_URL   — public origin only, e.g. https://your-service.onrender.com (no trailing slash)
#   CRON_SECRET    — must match the production env CRON_SECRET on your host
#
# Note: GitHub does not allow `secrets` in job-level `if:` — guards run inside the step below.

name: Economic Calendar Ingest

on:
  schedule:
    # Daily 06:30 UTC (~1:30am ET standard / 2:30am daylight — before RTH; weekly XML is idempotent)
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: economic-calendar-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: POST /api/cron/economic-calendar
        uses: ./.github/actions/post-cron-endpoint
        with:
          base_url: ${{ secrets.APP_BASE_URL }}
          cron_secret: ${{ secrets.CRON_SECRET }}
          path: /api/cron/economic-calendar
      - name: POST /api/cron/market-events/fed
        uses: ./.github/actions/post-cron-endpoint
        with:
          base_url: ${{ secrets.APP_BASE_URL }}
          cron_secret: ${{ secrets.CRON_SECRET }}
          path: /api/cron/market-events/fed
      - name: POST /api/cron/market-events/treasury
        uses: ./.github/actions/post-cron-endpoint
        with:
          base_url: ${{ secrets.APP_BASE_URL }}
          cron_secret: ${{ secrets.CRON_SECRET }}
          path: /api/cron/market-events/treasury
      - name: POST /api/cron/market-events/white-house
        uses: ./.github/actions/post-cron-endpoint
        with:
          base_url: ${{ secrets.APP_BASE_URL }}
          cron_secret: ${{ secrets.CRON_SECRET }}
          path: /api/cron/market-events/white-house
      - name: POST /api/cron/market-events/ustr
        uses: ./.github/actions/post-cron-endpoint
        with:
          base_url: ${{ secrets.APP_BASE_URL }}
          cron_secret: ${{ secrets.CRON_SECRET }}
          path: /api/cron/market-events/ustr
