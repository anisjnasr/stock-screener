# Triggers production calendar ingests:
#   - /api/cron/economic-calendar (Forex Factory → Supabase)
#   - /api/cron/market-events/* (Fed, Treasury, White House, USTR → Supabase)
# Operator guide: docs/ECONOMIC-CALENDAR-PRODUCTION.md
#
# Setup (repository Settings → Secrets and variables → Actions):
#   APP_BASE_URL   — public origin only, e.g. https://your-service.onrender.com (no trailing slash)
#   CRON_SECRET    — must match the production env CRON_SECRET on your host
#
# Note: GitHub does not allow `secrets` in job-level `if:` — guards run inside the step below.

name: Economic Calendar Ingest

on:
  schedule:
    # Daily 06:30 UTC (~1:30am ET standard / 2:30am daylight — before RTH; weekly XML is idempotent)
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: economic-calendar-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST economic and market calendar crons
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "::notice::Skipping ingest: APP_BASE_URL or CRON_SECRET is not set."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Add repository Actions secrets APP_BASE_URL and CRON_SECRET (see workflow header comment)."
              exit 1
            fi
            exit 0
          fi
          BASE_TRIMMED="${BASE%/}"
          post() {
            local path="$1"
            local file="resp-${path//\//_}.json"
            local url="${BASE_TRIMMED}${path}"
            echo "POST $url"
            code=$(curl -sS -o "$file" -w "%{http_code}" -X POST "$url" \
              -H "Authorization: Bearer ${SECRET}" \
              -H "Accept: application/json")
            echo "HTTP $code"
            cat "$file"
            echo
            if [ "$code" != "200" ]; then
              echo "::error::Expected HTTP 200 for $path, got $code"
              exit 1
            fi
            python3 -c "import json; j=json.load(open('$file')); assert j.get('ok') is True, j"
          }

          post "/api/cron/economic-calendar"
          post "/api/cron/market-events/fed"
          post "/api/cron/market-events/treasury"
          post "/api/cron/market-events/white-house"
          post "/api/cron/market-events/ustr"
