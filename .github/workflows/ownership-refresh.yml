name: Ownership 13F Refresh

on:
  schedule:
    # Daily lightweight incremental check/update (latest quarter only).
    - cron: "15 2 * * *"
    # Weekly full recompute (all 8 quarters) to pick up CUSIP map improvements.
    - cron: "30 3 * * 0"
  workflow_dispatch:
    inputs:
      quarters:
        description: "How many quarters to process (ignored when latest_only=true)"
        required: false
        default: "8"
        type: string
      latest_only:
        description: "Process latest quarter only"
        required: false
        default: true
        type: boolean
      recompute:
        description: "Delete and recompute selected quarter rows"
        required: false
        default: false
        type: boolean

concurrency:
  group: ownership-refresh
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  DB_CACHE_PREFIX: screener-db-v1

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Restore DB from cache
        uses: actions/cache/restore@v4
        with:
          path: data/screener.db
          key: ${{ env.DB_CACHE_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.DB_CACHE_PREFIX }}-
          enableCrossOsArchive: true

      - name: Verify DB exists
        run: |
          node -e "
          const fs = require('fs');
          const p = 'data/screener.db';
          if (!fs.existsSync(p)) {
            console.error('::error::No screener.db found from cache.');
            process.exit(1);
          }
          console.log('DB size', Math.round(fs.statSync(p).size/1024/1024), 'MB');
          "

      - name: Refresh ownership (13F)
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "30 3 * * 0" ]; then
              echo "Weekly full recompute (all 8 quarters)"
              ARGS+=("--recompute")
            else
              echo "Daily latest-only refresh"
              ARGS+=("--latest-only")
            fi
          else
            if [ "${{ github.event.inputs.latest_only }}" = "true" ]; then ARGS+=("--latest-only"); fi
            if [ "${{ github.event.inputs.recompute }}" = "true" ]; then ARGS+=("--recompute"); fi
            if [ -n "${{ github.event.inputs.quarters }}" ]; then ARGS+=("--quarters" "${{ github.event.inputs.quarters }}"); fi
          fi
          echo "Args: ${ARGS[@]}"
          node scripts/refresh-ownership.mjs "${ARGS[@]}"

      - name: Ownership sanity checks
        run: node scripts/check-ownership-refresh.mjs

      - name: Optimize database
        run: node scripts/optimize-db.mjs

      - name: Generate DB manifest
        run: |
          export DB_SHA256=$(sha256sum data/screener.db | awk '{print $1}')
          export DB_BYTES=$(stat -c%s data/screener.db)
          node -e "
          const fs = require('fs');
          const bytes = Number(process.env.DB_BYTES);
          const out = {
            runId: process.env.GITHUB_RUN_ID,
            mode: 'ownership',
            dbBytes: bytes,
            dbSizeMb: Math.ceil(bytes / 1024 / 1024),
            sha256: process.env.DB_SHA256,
            generatedAt: new Date().toISOString()
          };
          fs.writeFileSync('data/screener-db-manifest.json', JSON.stringify(out, null, 2));
          console.log('Manifest generated:', out);
          "

      - name: Save DB to cache
        uses: actions/cache/save@v4
        with:
          path: data/screener.db
          key: ${{ env.DB_CACHE_PREFIX }}-${{ github.run_id }}
          enableCrossOsArchive: true

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: screener-db-ownership-${{ github.run_id }}
          path: |
            data/screener.db
            data/screener-db-manifest.json
          retention-days: 3
          compression-level: 1

      - name: Upload DB manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: screener-db-ownership-manifest-${{ github.run_id }}
          path: data/screener-db-manifest.json
          retention-days: 3
          compression-level: 1

      # Sync refreshed DB to Render persistent disk
      - name: Sync DB to Render
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          if [ -z "$RENDER_APP_URL" ] || [ -z "$ADMIN_SECRET" ]; then
            echo "Skipping DB sync: RENDER_APP_URL or ADMIN_SECRET not configured"
            exit 0
          fi
          echo "Running Render preflight check..."
          PREFLIGHT_STATUS=$(curl -s -o /tmp/sync-preflight.json -w "%{http_code}" \
            --max-time 120 \
            -X POST "${RENDER_APP_URL}/api/admin/sync-db?artifact=ownership&preflight=true" \
            -H "Authorization: Bearer ${ADMIN_SECRET}" \
            -H "Content-Type: application/json")
          echo "Preflight status: $PREFLIGHT_STATUS"
          cat /tmp/sync-preflight.json
          if [ "$PREFLIGHT_STATUS" -lt 200 ] || [ "$PREFLIGHT_STATUS" -ge 300 ]; then
            echo "::error::Render preflight failed with status $PREFLIGHT_STATUS"
            exit 1
          fi
          ENOUGH=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/sync-preflight.json','utf8')); process.stdout.write(String(Boolean(d.snapshot && d.snapshot.enoughSpace)));")
          if [ "$ENOUGH" != "true" ]; then
            echo "::error::Render preflight reports insufficient disk for safe sync. Increase persistent disk or perform controlled maintenance recovery."
            exit 1
          fi
          echo "Triggering async DB sync on Render..."
          STATUS=$(curl -s -o /tmp/sync-trigger.json -w "%{http_code}" \
            --max-time 120 \
            -X POST "${RENDER_APP_URL}/api/admin/sync-db?artifact=ownership&wait=false" \
            -H "Authorization: Bearer ${ADMIN_SECRET}" \
            -H "Content-Type: application/json")
          echo "Trigger response status: $STATUS"
          cat /tmp/sync-trigger.json
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "DB sync started; polling status..."
          else
            echo "::error::DB sync trigger failed with status $STATUS"
            exit 1
          fi
          MAX_POLLS=140
          SLEEP_SEC=30
          CONSEC_FAILS=0
          MAX_CONSEC_FAILS=8
          for i in $(seq 1 $MAX_POLLS); do
            STATUS_CODE=$(curl -s -o /tmp/sync-status.json -w "%{http_code}" \
              --max-time 20 \
              -X GET "${RENDER_APP_URL}/api/admin/sync-db" \
              -H "Authorization: Bearer ${ADMIN_SECRET}" \
              -H "Content-Type: application/json" || echo "000")
            if [ "$STATUS_CODE" -lt 200 ] || [ "$STATUS_CODE" -ge 300 ]; then
              CONSEC_FAILS=$((CONSEC_FAILS + 1))
              echo "::warning::Status polling attempt $i failed with HTTP $STATUS_CODE (consecutive=$CONSEC_FAILS)"
              if [ "$CONSEC_FAILS" -ge "$MAX_CONSEC_FAILS" ]; then
                echo "::error::Status polling failed $CONSEC_FAILS times in a row"
                cat /tmp/sync-status.json || true
                exit 1
              fi
              sleep "$SLEEP_SEC"
              continue
            fi
            CONSEC_FAILS=0
            STATE=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/sync-status.json','utf8')); process.stdout.write(String(d.status && d.status.state ? d.status.state : 'unknown'));")
            ARTIFACT=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/sync-status.json','utf8')); process.stdout.write(String(d.status && d.status.artifact ? d.status.artifact : ''));")
            echo "Poll $i/$MAX_POLLS: state=$STATE artifact=$ARTIFACT"
            if [ "$STATE" = "completed" ]; then
              echo "DB sync completed successfully on Render"
              break
            fi
            if [ "$STATE" = "failed" ]; then
              echo "::error::DB sync failed on Render"
              cat /tmp/sync-status.json
              exit 1
            fi
            if [ "$i" -eq "$MAX_POLLS" ]; then
              echo "::error::DB sync polling timed out after $MAX_POLLS attempts"
              cat /tmp/sync-status.json
              exit 1
            fi
            sleep "$SLEEP_SEC"
          done

      - name: Send completion email via Formspree
        if: ${{ always() }}
        env:
          FORMSPREE_ENDPOINT: ${{ secrets.FORMSPREE_ENDPOINT }}
        run: |
          if [ -z "$FORMSPREE_ENDPOINT" ]; then
            echo "Skipping notification: FORMSPREE_ENDPOINT not configured"
            exit 0
          fi
          STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          curl -s -X POST "$FORMSPREE_ENDPOINT" \
            -H "Content-Type: application/json" \
            -d "{
              \"_subject\": \"[StockStalker] Ownership 13F Refresh — ${STATUS}\",
              \"workflow\": \"Ownership 13F Refresh\",
              \"status\": \"${STATUS}\",
              \"completed\": \"${DATE}\",
              \"run_url\": \"${RUN_URL}\"
            }" || echo "Formspree notification failed (non-fatal)"

