# POST /api/cron/theme-extraction (premarket inputs + gappers → daily_themes)
#
# Secrets: APP_BASE_URL, CRON_SECRET
#
# Scheduled runs: `premarket-brief-pipeline.yml`.

name: Theme extraction

on:
  workflow_dispatch:

concurrency:
  group: theme-extraction-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: POST /api/cron/theme-extraction
        uses: ./.github/actions/post-cron-endpoint
        with:
          base_url: ${{ secrets.APP_BASE_URL }}
          cron_secret: ${{ secrets.CRON_SECRET }}
          path: /api/cron/theme-extraction
