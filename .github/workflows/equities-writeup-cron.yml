# POST /api/cron/equities-writeup (newsletter_archive → daily_equities_writeup, or web-search fallback)
#
# Secrets: APP_BASE_URL, CRON_SECRET
#
# Scheduled runs: `premarket-brief-pipeline.yml` (runs after macro in the same job).

name: Equities writeup

on:
  workflow_dispatch:

concurrency:
  group: equities-writeup-cron
  cancel-in-progress: false

jobs:
  writeup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: POST /api/cron/equities-writeup
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "::notice::Skipping: APP_BASE_URL or CRON_SECRET is not set."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Add repository Actions secrets APP_BASE_URL and CRON_SECRET."
              exit 1
            fi
            exit 0
          fi
          BASE_TRIMMED="${BASE%/}"
          URL="${BASE_TRIMMED}/api/cron/equities-writeup"
          echo "POST $URL"
          code=$(curl -sS -o resp.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Accept: application/json")
          echo "HTTP $code"
          cat resp.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Expected HTTP 200, got $code"
            exit 1
          fi
          python3 -c "import json,sys; j=json.load(open('resp.json')); assert j.get('ok') is True, j"
