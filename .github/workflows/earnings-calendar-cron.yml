# Production earnings pipeline: big_name_universe → Finnhub ingest → actuals refresh.
# Deploy the app with these API routes before the workflow can succeed (otherwise POST returns 404).
#
# Setup (repository Settings → Secrets and variables → Actions):
#   APP_BASE_URL   — public origin only, e.g. https://your-service.onrender.com (no trailing slash)
#   CRON_SECRET    — must match the production env CRON_SECRET on your host
#
# Host env must include FINNHUB_API_KEY and Supabase service role (same as local cron docs).
#
# Schedules (UTC):
#   1st of month 08:00  — refresh universe (~03:00 ET standard time)
#   Mon–Fri 11:00       — forward window ingest (~06:00 ET)
#   Mon–Fri 21:00       — actuals refresh (~16:00–17:00 ET)
#
# workflow_dispatch runs universe → ingest → actuals in order (bootstrap or catch-up).

name: Earnings Calendar Crons

on:
  schedule:
    - cron: "0 8 1 * *"
    - cron: "0 11 * * 1-5"
    - cron: "0 21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: earnings-calendar-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: POST /api/cron/earnings/universe
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 1 * *'
        uses: ./.github/actions/post-cron-endpoint
        with:
          base_url: ${{ secrets.APP_BASE_URL }}
          cron_secret: ${{ secrets.CRON_SECRET }}
          path: /api/cron/earnings/universe
      - name: POST /api/cron/earnings/ingest
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * 1-5'
        uses: ./.github/actions/post-cron-endpoint
        with:
          base_url: ${{ secrets.APP_BASE_URL }}
          cron_secret: ${{ secrets.CRON_SECRET }}
          path: /api/cron/earnings/ingest
      - name: POST /api/cron/earnings/actuals
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 * * 1-5'
        uses: ./.github/actions/post-cron-endpoint
        with:
          base_url: ${{ secrets.APP_BASE_URL }}
          cron_secret: ${{ secrets.CRON_SECRET }}
          path: /api/cron/earnings/actuals
