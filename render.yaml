# Render Blueprint: Stock Scanner + Phase 12A Python microservice (monorepo).
# Connect this repo in Render Dashboard (New > Blueprint) to create/update services.
# Then add MASSIVE_API_KEY in the service Environment and run DB setup (see docs/DEPLOY.md).
#
# Python service: set INTERNAL_API_KEY in the dashboard. Next.js uses PYTHON_SERVICE_URL +
# PYTHON_SERVICE_KEY (same secret) when Phase 12B calls /news.

services:
  - type: web
    name: stock-scanner
    runtime: node
    region: oregon
    plan: starter

    buildCommand: npm ci && npm run build
    startCommand: npm run start

    envVars:
      - key: NODE_ENV
        value: production
      - key: MASSIVE_API_KEY
        sync: false
      # Pre-market economic calendar (Supabase ingest + UI). Set in Render dashboard (Blueprint sync: false).
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      # Phase 12A/B — Python microservice (same secret as Python INTERNAL_API_KEY).
      - key: PYTHON_SERVICE_URL
        sync: false
      - key: PYTHON_SERVICE_KEY
        sync: false
      # Point the app at the persistent disk so the DB survives deploys.
      # The app auto-detects /app/data as a fallback, but this is explicit.
      - key: SCREENER_DB_PATH
        value: /app/data/screener.db
      - key: SCREENER_DATA_DIR
        value: /app/data

    # Persistent disk for screener.db — survives deploys.
    # For Docker (WORKDIR /app): process.cwd()/data = /app/data — matches.
    # For native Node: process.cwd() != /app, so SCREENER_DB_PATH above is needed.
    disk:
      name: screener-data
      mountPath: /app/data
      # Sync preflight needs roughly2x screener.db size + ~400MB margin on this volume.
      sizeGB: 20

  # Phase 12A — yfinance news API for Stocks in Play (see stockstalker-python-service/README.md).
  - type: web
    name: stockstalker-python
    runtime: python
    region: oregon
    plan: starter
    rootDir: stockstalker-python-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: INTERNAL_API_KEY
        sync: false
      # Large Cap Analysis — Claude API (same key can be used as main app if desired)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_LARGE_CAP_MODEL
        value: claude-sonnet-4-6
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Large Cap digest reads local screener.db (separate disk from StockStalker — sync DB after first deploy).
      - key: SCREENER_DB_PATH
        value: /app/data/screener.db
      - key: SCREENER_DATA_DIR
        value: /app/data
      # Main Stock Scanner URL — Python pulls screener.db from /api/admin/screener-db-export after main sync.
      - key: STOCK_SCANNER_APP_URL
        sync: false

    # Persistent disk for screener.db — separate volume from StockStalker; auto-synced from main app.
    disk:
      name: screener-data-python
      mountPath: /app/data
      sizeGB: 30
